name: VeriBid CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Harness and backend tests
        run: |
          python scripts/check_agent_harness.py
          python -m pytest backend/test_health.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            infra/package-lock.json
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run test
      - name: Infrastructure checks
        working-directory: infra
        run: |
          npm ci
          npm run build
          npm run synth
