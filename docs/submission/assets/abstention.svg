<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><text x="80" y="90" fill="#0f172a" font-family="Arial" font-size="44" font-weight="700">When evidence is missing, VeriBid abstains</text><rect x="80" y="180" width="1440" height="480" rx="26" fill="#fff" stroke="#e11d48" stroke-width="4"/><text x="145" y="270" fill="#be123c" font-family="Arial" font-size="32" font-weight="700">VENDOR C</text><text x="145" y="350" fill="#be123c" font-family="Arial" font-size="42" font-weight="700">INSUFFICIENT_EVIDENCE</text><text x="145" y="425" fill="#334155" font-family="Arial" font-size="28">No resolvable source claim.</text><path d="M145 480 H1450" stroke="#cbd5e1" stroke-width="2"/><text x="145" y="545" fill="#475569" font-family="Arial" font-size="24">This is explicit abstention — not an inferred vendor claim.</text><text x="145" y="600" fill="#475569" font-family="Arial" font-size="24">A human reviewer sees the uncertainty instead of a fabricated answer.</text><rect x="80" y="735" width="1440" height="62" rx="30" fill="#fee2e2"/><text x="800" y="775" text-anchor="middle" fill="#991b1b" font-family="Arial" font-size="21">Illustrative evidence card based on the verified fixture — not a UI screenshot</text></svg>
