  <g stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M340 238 H410"/><path d="M680 238 H750"/><path d="M1020 238 H1090"/><path d="M1270 290 V430"/><path d="M1090 238 C900 330 650 350 480 490"/><path d="M1270 555 V675"/><path d="M950 490 H1120"/><path d="M650 490 H480"/>
