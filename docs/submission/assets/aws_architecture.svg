  <text x="80" y="805" fill="#64748b" font-family="Arial,sans-serif" font-size="18">Explanatory diagram based on the deployed resource inventory; not an AWS Console screenshot. Textract, AgentCore and a dedicated vector DB are outside this MVP.</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
