<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#07111f"/><text x="80" y="85" fill="#fff" font-family="Arial" font-size="43" font-weight="700">From inspection to production proof</text><text x="80" y="130" fill="#9fb3c8" font-family="Arial" font-size="22">Three concrete development episodes — no generic “AI helped code” claim.</text><path d="M180 460 H1420" stroke="#64748b" stroke-width="8"/><g font-family="Arial"><circle cx="300" cy="460" r="38" fill="#5eead4"/><circle cx="800" cy="460" r="38" fill="#86efac"/><circle cx="1300" cy="460" r="38" fill="#c4b5fd"/><text x="300" y="550" text-anchor="middle" fill="#5eead4" font-size="28" font-weight="700">1 · TRACE</text><text x="300" y="605" text-anchor="middle" fill="#e2e8f0" font-size="22">Both conflict sides</text><text x="300" y="640" text-anchor="middle" fill="#e2e8f0" font-size="22">carry SourcePointers</text><text x="800" y="550" text-anchor="middle" fill="#86efac" font-size="28" font-weight="700">2 · DELIVER</text><text x="800" y="605" text-anchor="middle" fill="#e2e8f0" font-size="22">CI assembly → non-root</text><text x="800" y="640" text-anchor="middle" fill="#e2e8f0" font-size="22">UPDATE_COMPLETE + job 6</text><text x="1300" y="550" text-anchor="middle" fill="#c4b5fd" font-size="28" font-weight="700">3 · REPLAY</text><text x="1300" y="605" text-anchor="middle" fill="#e2e8f0" font-size="22">Fresh synthetic run</text><text x="1300" y="640" text-anchor="middle" fill="#e2e8f0" font-size="22">review + export READY</text></g><rect x="300" y="740" width="1000" height="62" rx="31" fill="#172b1d" stroke="#86efac" stroke-width="2"/><text x="800" y="780" text-anchor="middle" fill="#86efac" font-family="Arial" font-size="21">Evidence sources: docs/submission-proof/ · redacted development story</text></svg>
