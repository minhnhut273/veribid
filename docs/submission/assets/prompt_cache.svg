<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><text x="80" y="90" fill="#0f172a" font-family="Arial" font-size="44" font-weight="700">Prompt caching — one measured pair</text><text x="80" y="135" fill="#475569" font-family="Arial" font-size="22">Provider usage metadata is the proof; repeated requests alone are not.</text><rect x="100" y="220" width="620" height="420" rx="26" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="160" y="300" fill="#1e40af" font-family="Arial" font-size="31" font-weight="700">COLD REQUEST</text><text x="160" y="390" fill="#0f172a" font-family="Arial" font-size="62" font-weight="700">4,801</text><text x="160" y="435" fill="#334155" font-family="Arial" font-size="25">cache-write input tokens</text><rect x="880" y="220" width="620" height="420" rx="26" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="940" y="300" fill="#166534" font-family="Arial" font-size="31" font-weight="700">WARM REQUEST</text><text x="940" y="390" fill="#0f172a" font-family="Arial" font-size="62" font-weight="700">4,801</text><text x="940" y="435" fill="#334155" font-family="Arial" font-size="25">cache-read input tokens</text><path d="M720 430 H880" stroke="#64748b" stroke-width="6" marker-end="url(#a)"/><text x="800" y="385" text-anchor="middle" fill="#475569" font-family="Arial" font-size="21">same stable prefix</text><rect x="100" y="730" width="1400" height="62" rx="30" fill="#fef3c7"/><text x="800" y="770" text-anchor="middle" fill="#92400e" font-family="Arial" font-size="21">Sample size: one cold/warm pair · no p50/p95 or production-wide savings claim</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs></svg>
